# Netlify settings for the frontend (set "Base directory" to Frontend in Netlify).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 1) Send every /api request on to the backend on Render.
#    The browser only ever talks to the Netlify address, so the login cookie
#    counts as "same site" and works in every browser (Safari included).
#    >>> Replace YOUR-BACKEND with your Render service's address. <<<
[[redirects]]
  from = "/api/*"
  to = "https://jobportal-aeqf.onrender.com/api/:splat"
  status = 200
  force = true

# 2) Single-page app: let React Router handle every other address,
#    so refreshing /Jobs or /Profile doesn't show "Page not found".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
